; Pool php-fpm – le maître tourne déjà en www-data (USER du Dockerfile) :
; pas de directives user/group.
[global]
error_log = /proc/self/fd/2
log_limit = 8192
daemonize = no

[www]
listen = 0.0.0.0:9000
; Seuls les serveurs web du réseau app_net peuvent parler FastCGI
listen.allowed_clients = 172.30.20.21,172.30.20.22,172.30.20.23,127.0.0.1
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
request_terminate_timeout = 15s
clear_env = yes
env[TZ] = $TZ
catch_workers_output = yes
decorate_workers_output = no
security.limit_extensions = .php
