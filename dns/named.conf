// =============================================================================
// Projet 7 – bind9 : serveur faisant AUTORITÉ uniquement pour projet7.local
//  - pas de récursion (pas de résolveur ouvert, pas d'empoisonnement de cache)
//  - pas de transfert de zone, version masquée, RRL (anti-amplification)
//  - requêtes acceptées depuis le LAN VMnet8 uniquement
// =============================================================================
acl lan { 192.168.89.0/24; 127.0.0.1; };

options {
    directory "/tmp";                 // rootfs en lecture seule : fichiers de travail en tmpfs
    pid-file  "/tmp/named.pid";
    session-keyfile "/tmp/session.key";
    listen-on port 53 { 192.168.89.53; 127.0.0.1; };
    listen-on-v6 { none; };

    recursion no;
    allow-recursion { none; };
    allow-query { lan; };
    allow-transfer { none; };
    allow-update { none; };
    notify no;
    dnssec-validation no;             // sans récursion, la validation est sans objet

    version none;
    hostname none;
    server-id none;
    minimal-responses yes;

    rate-limit {                      // Response Rate Limiting
        responses-per-second 20;
        window 5;
    };
};

controls { };                         // pas de canal rndc (aucune administration à distance)

logging {
    channel stderr_ch { stderr; severity info; print-time no; print-category yes; };
    category default  { stderr_ch; };
    category queries  { stderr_ch; };   // journal des requêtes (démo / audit)
    category lame-servers { null; };
};

zone "projet7.local" {
    type primary;
    file "/etc/bind/zones/db.projet7.local";
};
