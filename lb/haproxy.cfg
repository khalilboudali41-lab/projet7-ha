# =============================================================================
# Projet 7 – tier LB (lb1 / lb2)
#  - terminaison TLS (1.2/1.3 uniquement) pour www.projet7.local
#  - redirection HTTP → HTTPS, HSTS, en-têtes de sécurité
#  - rate limiting par IP, health checks HTTP des serveurs web (3 en mono-VM, 1 local en multi-VM)
#  - page de statistiques HTTPS, authentifiée, réservée au LAN
# Variables d'environnement : LB_NAME, LB_IP, VIP, P7_MULTI_VM (définie = topologie multi-VM)
# Utilisateurs (empreintes SHA-512) : /run/secrets/haproxy_users_cfg (2e fichier -f)
# =============================================================================
global
    log 172.30.40.10:5514 len 4096 local0 info
    log-tag "haproxy-${LB_NAME}"
    log-send-hostname "${LB_NAME}"
    maxconn 4000
    stats socket /tmp/admin.sock mode 600 level admin
    # TLS : profil « intermediate » (Mozilla) – TLS 1.2 et 1.3 uniquement, AEAD + PFS
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-bind-curves X25519:P-256:P-384

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option http-server-close
    option forwardfor
    # Serveur mort (conteneur tué : l'IP ne répond plus) : échec de connexion en 500 ms
    # puis nouvel essai sur un AUTRE serveur (redispatch à chaque essai). Pire cas mesuré
    # avec 2 web morts sur 3 non encore détectés : 3 × 0,5 s = 1,5 s de latence au lieu
    # d'une erreur (scripts/test_failover_web.sh). Réseau interne : connexion en < 1 ms.
    option redispatch 1
    retries 3
    # Rejoue aussi une requête en cours quand le serveur meurt sans répondre (502 « SH »).
    # Sûr ici : seules GET/HEAD sont acceptées. Compromis : une visite déjà commitée par
    # php-fpm peut être comptée 2 fois (le compteur reste strictement croissant).
    retry-on conn-failure empty-response response-timeout
    timeout connect 500ms
    timeout client  30s
    timeout server  30s
    timeout http-request 10s
    timeout http-keep-alive 10s
    timeout queue 10s
    timeout check 2s
    errorfile 429 /usr/local/etc/haproxy/errors/429.http

# -----------------------------------------------------------------------------
# Supervision locale (keepalived : vrrp_script chk_haproxy) – loopback uniquement
frontend fe_monitor
    bind 127.0.0.1:8405
    monitor-uri /healthz
    # Si aucun serveur web n'est disponible, ce LB n'est plus utile : il se déclare en échec
    monitor fail if { nbsrv(be_web) lt 1 }

# -----------------------------------------------------------------------------
# HTTP : uniquement pour rediriger vers HTTPS
frontend fe_http
    bind "${VIP}":80
    bind "${LB_IP}":80
    http-request redirect scheme https code 301

# -----------------------------------------------------------------------------
frontend fe_https
    bind "${VIP}":443 ssl crt /run/secrets/haproxy_pem alpn h2,http/1.1
    bind "${LB_IP}":443 ssl crt /run/secrets/haproxy_pem alpn h2,http/1.1

    # --- Rate limiting : 100 requêtes / 10 s et 30 connexions simultanées par IP ---
    stick-table type ip size 100k expire 60s store http_req_rate(10s),conn_cur
    http-request track-sc0 src
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 100 }
    http-request deny deny_status 429 if { sc_conn_cur(0) gt 30 }

    # --- Noms d'hôte acceptés : www.projet7.local (projet7.local → www) ---
    acl host_www  hdr(host),field(1,:) -i www.projet7.local
    acl host_apex hdr(host),field(1,:) -i projet7.local
    http-request redirect prefix https://www.projet7.local code 301 if host_apex
    http-request deny deny_status 421 unless host_www

    # --- Méthodes : le site est en lecture seule ---
    http-request deny deny_status 405 unless METH_GET or METH_HEAD

    # --- Informations transmises aux serveurs web ---
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Host %[req.hdr(host)]
    http-request set-header X-Request-ID %[uuid(4)]
    # LB qui a servi la requête, affiché par l'appli (démo). Toujours ÉCRASÉ ici :
    # une valeur envoyée par le client ne peut pas être reprise.
    http-request set-header X-LB-Node "${LB_NAME}"

    # --- En-têtes de sécurité HTTP ---
    http-response set-header Strict-Transport-Security "max-age=63072000; includeSubDomains"
    http-response set-header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"
    http-response set-header X-Content-Type-Options nosniff
    http-response set-header X-Frame-Options DENY
    http-response set-header Referrer-Policy no-referrer
    http-response set-header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"
    http-response set-header Cross-Origin-Opener-Policy same-origin
    http-response set-header Cross-Origin-Resource-Policy same-origin
    http-response del-header Server
    http-response del-header X-Powered-By
    # Démo : indique quel LB a servi la requête (avec X-Web-Node / X-App-Node)
    http-response set-header X-LB-Node "${LB_NAME}"

    default_backend be_web

# -----------------------------------------------------------------------------
backend be_web
    balance leastconn
    # Application sans état (tout est en base) : pas de sticky session nécessaire.
    # Pour une appli à sessions locales, il suffirait d'ajouter :
    #   cookie SRV insert indirect nocache httponly secure  (+ « cookie webN » par serveur)
    option httpchk
    http-check send meth GET uri /healthz ver HTTP/1.1 hdr Host www.projet7.local
    http-check expect status 200
    # check toutes les 2 s ; dès le 1er échec, rythme 500 ms (fastinter) → DOWN en ~2,5 s.
    # Contrôle passif layer4 : 2 échecs de connexion sur le trafic réel → DOWN immédiat.
    # (pas layer7 : les 503 de l'appli pendant une bascule DB retireraient TOUS les web)
    default-server check inter 2s fastinter 500ms downinter 2s fall 2 rise 2 observe layer4 error-limit 2 on-error mark-down
.if defined(P7_MULTI_VM)
    # Multi-VM : un seul serveur web par VM, le web local. Si la chaîne locale
    # (nginx → php-fpm) tombe, fe_monitor échoue, keepalived passe en FAULT et la
    # VIP part sur l'autre VM (docker-compose.node1.yml / node2.yml).
    server web-local 172.30.10.11:8080
.else
    server web1 172.30.10.11:8080
    server web2 172.30.10.12:8080
    server web3 172.30.10.13:8080
.endif

# -----------------------------------------------------------------------------
# Statistiques : HTTPS, poste d'administration uniquement, authentification (SHA-512)
frontend fe_stats
    bind "${VIP}":8404 ssl crt /run/secrets/haproxy_pem
    bind "${LB_IP}":8404 ssl crt /run/secrets/haproxy_pem
    # Seul le poste Windows d'administration (192.168.89.1) ; tout autre client → 403
    acl from_admin src 192.168.89.1
    http-request deny deny_status 403 unless from_admin
    http-request auth realm "Projet7 HAProxy stats" unless { http_auth(stats_users) }
    http-response set-header Strict-Transport-Security "max-age=63072000; includeSubDomains"
    http-response set-header X-Frame-Options DENY
    stats enable
    stats uri /stats
    stats refresh 5s
    stats show-node "${LB_NAME}"
    stats show-legends
    stats hide-version
