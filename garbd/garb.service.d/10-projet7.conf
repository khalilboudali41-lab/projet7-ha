# =============================================================================
# Projet 7 – surcharge de garb.service (paquet galera) sur VM3
# Installé en /etc/systemd/system/garb.service.d/10-projet7.conf (root:root 0644)
# puis : systemctl daemon-reload && systemctl enable --now garb
#
#  - redémarrage automatique : l'unité du paquet n'en a pas. garbd s'arrête s'il
#    ne joint aucun nœud au démarrage, ou s'il est exclu du cluster ; il doit
#    revenir seul (p. ex. quand VM1/VM2 redémarre) ;
#  - durcissement : garbd n'a besoin que du réseau et de son répertoire de travail.
# Vérification : systemd-analyze security garb
# =============================================================================
[Unit]
# Le réseau doit être configuré (IP DHCP réservée) avant le démarrage
After=network-online.target
Wants=network-online.target
# Pas de limite de tentatives : l'arbitre doit toujours finir par revenir
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=5s

# Répertoire de travail /var/lib/garb (propriétaire garb, 0700)
StateDirectory=garb
StateDirectoryMode=0700
UMask=0077

# --- Durcissement ---
NoNewPrivileges=yes
CapabilityBoundingSet=
AmbientCapabilities=
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
RemoveIPC=yes
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
