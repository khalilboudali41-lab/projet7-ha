# =============================================================================
# dbproxy – répartiteur SQL interne (réseau db_net uniquement, jamais exposé)
# Stratégie « un seul écrivain » : toutes les connexions vont sur galera1 ;
# galera2 puis galera3 ne prennent le relais que s'il tombe. Évite les conflits
# de certification Galera (deadlocks) liés aux écritures concurrentes multi-nœuds.
# Les 2 instances (dbproxy1/2) appliquent la même règle → même écrivain.
# Multi-VM (variable P7_MULTI_VM définie) : un dbproxy par VM, qui joint les
# deux nœuds par l'IP de leur VM (Galera en réseau hôte) via le réseau db_uplink ;
# même ordre sur les 2 VMs : galera1 (VM1) écrit, galera2 (VM2) en secours.
# =============================================================================
global
    log stdout format raw local0 info
    maxconn 1000
    # Check Galera par script (mariadb-client) : nécessite le fork de processus,
    # limité à ce proxy interne (le LB exposé n'en a pas besoin).
    external-check
    insecure-fork-wanted
    stats socket /tmp/admin.sock mode 600 level admin

defaults
    mode    tcp
    log     global
    option  tcplog
    option  dontlognull
    # Nœud mort : échec de connexion en 500 ms (réseau interne : connexion < 1 ms)
    timeout connect 500ms
    timeout client  5m
    timeout server  5m
    timeout check   3s
    retries 3
    option redispatch 1

listen galera_writer
    bind :3306
    option external-check
    external-check path "/usr/bin:/bin"
    external-check command /usr/local/bin/galera-check.sh
    # Coupe les sessions vers un nœud déclaré DOWN (bascule immédiate du client)
    # Détection active : check toutes les 2 s, 500 ms dès le 1er échec (fastinter).
    # Détection PASSIVE (observe layer4) : la 1re connexion applicative qui échoue
    # marque le nœud DOWN et le nouvel essai part vers un secours, sans attendre
    # les checks. Faux positif sans gravité : Galera est multi-maître, et le nœud
    # revient après 3 checks OK (rise 3). Mesuré : scripts/test_failover_db.sh
    default-server inter 2s fastinter 500ms fall 2 rise 3 observe layer4 error-limit 1 on-error mark-down on-marked-down shutdown-sessions
.if defined(P7_MULTI_VM)
    server galera1 192.168.89.136:3306 check
    server galera2 192.168.89.138:3306 check backup
.else
    server galera1 172.30.30.11:3306 check
    server galera2 172.30.30.12:3306 check backup
    server galera3 172.30.30.13:3306 check backup
.endif
