# =============================================================================
# Journaux centralisés du projet 7
#  - HAProxy (lb1/lb2) envoie directement en syslog UDP (réseau log_net)
#  - tous les autres conteneurs : pilote Docker « syslog » vers 127.0.0.1:5514
#    (double journalisation : `docker logs` reste disponible)
# Un fichier par source dans ./logs/ + un fichier global all.log
# =============================================================================
global(workDirectory="/tmp" maxMessageSize="16k")
module(load="imudp")
input(type="imudp" port="5514")

template(name="PerSource" type="string" string="/logs/%programname%.log")
template(name="Line" type="string"
         string="%timegenerated:::date-rfc3339% %HOSTNAME% %programname%: %msg:::drop-last-lf%\n")

*.* action(type="omfile" dynaFile="PerSource" template="Line"
           dirCreateMode="0750" fileCreateMode="0640" dynaFileCacheSize="64")
*.* action(type="omfile" file="/logs/all.log" template="Line" fileCreateMode="0640")
