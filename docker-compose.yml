# =============================================================================
# Projet 7 – Architecture N-tiers haute disponibilité
#   LB (HAProxy ×2 + Keepalived/VIP) → Web (nginx ×3) → App (php-fpm ×3)
#   → dbproxy (HAProxy ×2) → MariaDB Galera ×3
# Déploiement : scripts/deploy.sh (gère .env, secrets et bootstrap Galera)
# =============================================================================
name: projet7

# --- Durcissement commun ------------------------------------------------------
x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  restart: unless-stopped
  # Journaux centralisés (collecteur rsyslog) ; `docker logs` reste disponible
  # grâce à la double journalisation du démon Docker
  logging:
    driver: syslog
    options:
      syslog-address: "udp://127.0.0.1:5514"
      syslog-format: rfc5424micro
      tag: "{{.Name}}"

# --- Nœud Galera (modèle) -----------------------------------------------------
x-galera: &galera
  <<: *hardening
  image: mariadb:11.4.13-noble
  entrypoint: ["/usr/local/bin/galera-entrypoint.sh"]
  # L'entrypoint officiel démarre en root puis bascule sur l'utilisateur mysql
  # (gosu) : seules les capacités nécessaires à cette bascule sont rendues.
  cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
  environment:
    MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    MARIADB_ROOT_HOST: localhost          # pas de root à distance
    TZ: ${TZ:-Europe/Paris}
  secrets: [db_root_password, db_sst_password, db_monitor_password, db_app_password, db_backup_password]
  healthcheck:
    test: ["CMD", "healthcheck.sh", "--defaults-extra-file=/etc/mysql/healthcheck-auth.cnf", "--connect", "--galera_online"]
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 180s                    # temps d'un SST complet
  stop_grace_period: 60s                  # arrêt propre → grastate.dat cohérent
  mem_limit: 512m

services:
  # ===========================================================================
  # Tier données
  # ===========================================================================
  galera1:
    <<: *galera
    container_name: galera1
    hostname: galera1
    command: ["mariadbd", "--wsrep_node_name=galera1", "--wsrep_node_address=172.30.30.11"]
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MARIADB_ROOT_HOST: localhost
      TZ: ${TZ:-Europe/Paris}
      GALERA_BOOTSTRAP: ${GALERA1_BOOTSTRAP:-0}
    volumes:
      - galera1_data:/var/lib/mysql
      - ./db/conf/galera.cnf:/etc/mysql/conf.d/60-projet7-galera.cnf:ro,z
      - ./db/galera-entrypoint.sh:/usr/local/bin/galera-entrypoint.sh:ro,z
      # Scripts d'initialisation : exécutés uniquement si le datadir est vide
      - ./db/initdb:/docker-entrypoint-initdb.d:ro,z
    networks:
      db_net: { ipv4_address: 172.30.30.11 }

  galera2:
    <<: *galera
    container_name: galera2
    hostname: galera2
    command: ["mariadbd", "--wsrep_node_name=galera2", "--wsrep_node_address=172.30.30.12"]
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MARIADB_ROOT_HOST: localhost
      TZ: ${TZ:-Europe/Paris}
      GALERA_BOOTSTRAP: ${GALERA2_BOOTSTRAP:-0}
    volumes:
      - galera2_data:/var/lib/mysql
      - ./db/conf/galera.cnf:/etc/mysql/conf.d/60-projet7-galera.cnf:ro,z
      - ./db/galera-entrypoint.sh:/usr/local/bin/galera-entrypoint.sh:ro,z
    networks:
      db_net: { ipv4_address: 172.30.30.12 }

  galera3:
    <<: *galera
    container_name: galera3
    hostname: galera3
    command: ["mariadbd", "--wsrep_node_name=galera3", "--wsrep_node_address=172.30.30.13"]
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MARIADB_ROOT_HOST: localhost
      TZ: ${TZ:-Europe/Paris}
      GALERA_BOOTSTRAP: ${GALERA3_BOOTSTRAP:-0}
    volumes:
      - galera3_data:/var/lib/mysql
      - ./db/conf/galera.cnf:/etc/mysql/conf.d/60-projet7-galera.cnf:ro,z
      - ./db/galera-entrypoint.sh:/usr/local/bin/galera-entrypoint.sh:ro,z
    networks:
      db_net: { ipv4_address: 172.30.30.13 }

  # --- Proxy SQL interne (×2, alias DNS « db ») -------------------------------
  dbproxy1: &dbproxy
    <<: *hardening
    build: ./db/dbproxy
    image: projet7/dbproxy:3.2.26
    container_name: dbproxy1
    hostname: dbproxy1
    read_only: true
    tmpfs: ["/tmp:size=8m"]
    secrets: [db_monitor_password]
    volumes:
      - ./db/dbproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro,z
    healthcheck:
      test: ["CMD-SHELL", "echo 'show info' | socat stdio unix-connect:/tmp/admin.sock | grep -q '^Uptime:'"]
      interval: 10s
      timeout: 3s
      retries: 3
    mem_limit: 64m
    networks:
      db_net:
        ipv4_address: 172.30.30.21
        aliases: [db]

  dbproxy2:
    <<: *dbproxy
    container_name: dbproxy2
    hostname: dbproxy2
    networks:
      db_net:
        ipv4_address: 172.30.30.22
        aliases: [db]

  # --- Sauvegarde logique planifiée -------------------------------------------
  backup:
    <<: *hardening
    image: mariadb:11.4.13-noble
    container_name: db-backup
    hostname: db-backup
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"   # fichiers de sauvegarde appartenant à l'utilisateur hôte
    entrypoint: ["/usr/local/bin/backup.sh", "loop"]
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    environment:
      TZ: ${TZ:-Europe/Paris}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-21600}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    secrets: [db_backup_password]
    volumes:
      - ./db/backup/backup.sh:/usr/local/bin/backup.sh:ro,z
      - ./backups:/backups:Z
    mem_limit: 128m
    networks:
      db_net: { ipv4_address: 172.30.30.31 }

  # ===========================================================================
  # Tier application (php-fpm ×3, image immuable, non-root)
  # ===========================================================================
  app1: &app
    <<: *hardening
    build: ./app
    image: projet7/vitrine-app:1.0
    container_name: app1
    hostname: app1
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    environment:
      TZ: ${TZ:-Europe/Paris}
    secrets: [db_app_password]
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 10s
      timeout: 3s
      retries: 3
    mem_limit: 128m
    networks:
      app_net: { ipv4_address: 172.30.20.11 }
      db_net:  { ipv4_address: 172.30.30.41 }

  app2:
    <<: *app
    container_name: app2
    hostname: app2
    networks:
      app_net: { ipv4_address: 172.30.20.12 }
      db_net:  { ipv4_address: 172.30.30.42 }

  app3:
    <<: *app
    container_name: app3
    hostname: app3
    networks:
      app_net: { ipv4_address: 172.30.20.13 }
      db_net:  { ipv4_address: 172.30.30.43 }

  # ===========================================================================
  # Tier web (nginx ×3, non-root, lecture seule)
  # ===========================================================================
  web1: &web
    <<: *hardening
    image: nginx:1.30.6-alpine
    container_name: web1
    hostname: web1
    user: "101:101"
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    environment:
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - ./web/nginx.conf:/etc/nginx/nginx.conf:ro,z
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3
    mem_limit: 64m
    networks:
      front_net: { ipv4_address: 172.30.10.11 }
      app_net:   { ipv4_address: 172.30.20.21 }

  web2:
    <<: *web
    container_name: web2
    hostname: web2
    networks:
      front_net: { ipv4_address: 172.30.10.12 }
      app_net:   { ipv4_address: 172.30.20.22 }

  web3:
    <<: *web
    container_name: web3
    hostname: web3
    networks:
      front_net: { ipv4_address: 172.30.10.13 }
      app_net:   { ipv4_address: 172.30.20.23 }

  # ===========================================================================
  # Tier load balancing : lb1 (MASTER) / lb2 (BACKUP), VIP 192.168.89.100
  # ===========================================================================
  lb1: &lb
    <<: *hardening
    build: ./lb
    image: projet7/lb:3.2.26-ka2.3.4
    container_name: lb1
    hostname: lb1
    environment: &lb1-env
      LB_NAME: lb1
      LB_IP: 192.168.89.101
      PEER_IP: 192.168.89.102
      VRRP_PRIORITY: "150"
      VIP: 192.168.89.100
      TZ: ${TZ:-Europe/Paris}
    # keepalived : NET_ADMIN (VIP), NET_RAW (VRRP) ; superviseur : SETUID/SETGID
    # (bascule vers l'utilisateur haproxy), KILL (signaux à HAProxy)
    cap_add: [NET_ADMIN, NET_RAW, SETUID, SETGID, KILL]
    sysctls:
      net.ipv4.ip_nonlocal_bind: 1           # BACKUP : HAProxy écoute déjà sur la VIP
      net.ipv4.ip_unprivileged_port_start: 0 # HAProxy non-root sur 80/443
    read_only: true
    tmpfs: ["/tmp:size=16m", "/run:size=4m"]
    secrets: [haproxy_pem, haproxy_users_cfg, vrrp_password]
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "2", "-O", "/dev/null", "http://127.0.0.1:8405/healthz"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    stop_grace_period: 10s
    mem_limit: 128m
    networks:
      lan:
        ipv4_address: 192.168.89.101
        interface_name: lan0
        gw_priority: 100
      front_net: { ipv4_address: 172.30.10.21 }
      log_net:   { ipv4_address: 172.30.40.21 }

  lb2:
    <<: *lb
    container_name: lb2
    hostname: lb2
    environment:
      <<: *lb1-env
      LB_NAME: lb2
      LB_IP: 192.168.89.102
      PEER_IP: 192.168.89.101
      VRRP_PRIORITY: "100"
    networks:
      lan:
        ipv4_address: 192.168.89.102
        interface_name: lan0
        gw_priority: 100
      front_net: { ipv4_address: 172.30.10.22 }
      log_net:   { ipv4_address: 172.30.40.22 }

  # ===========================================================================
  # Journaux centralisés
  # ===========================================================================
  # --- DNS faisant autorité pour projet7.local (bind9, non-root) ---------------
  dns:
    <<: *hardening
    build: ./dns
    image: projet7/dns:9.20.30
    container_name: dns
    hostname: ns1
    environment:
      TZ: ${TZ:-Europe/Paris}
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 53   # port 53 sans root ni capacité
    read_only: true
    tmpfs: ["/tmp:size=8m,uid=100,gid=101"]
    healthcheck:
      test: ["CMD-SHELL", "[ \"$$(dig +time=2 +tries=1 +short @127.0.0.1 www.projet7.local A)\" = 192.168.89.100 ]"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    mem_limit: 64m
    networks:
      lan:
        ipv4_address: 192.168.89.53

  logcollector:
    <<: *hardening
    build: ./logging
    image: projet7/logcollector:8.2608
    container_name: logcollector
    hostname: logcollector
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    logging:          # pas de boucle : le collecteur journalise localement
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    volumes:
      - ./logs:/logs:Z
    ports:
      - "127.0.0.1:5514:5514/udp"   # pilote syslog du démon Docker (loopback uniquement)
    mem_limit: 64m
    networks:
      log_net: { ipv4_address: 172.30.40.10 }

# =============================================================================
networks:
  # Réseau physique (VMnet8) : ipvlan L2 sur ens160 – chaque LB a sa propre IP
  # sur le LAN, la VIP passe de l'un à l'autre (même MAC que la VM : pas besoin
  # du mode promiscuité VMware)
  lan:
    driver: ipvlan
    driver_opts: { parent: ens160, ipvlan_mode: l2 }
    ipam:
      config:
        - subnet: 192.168.89.0/24
          gateway: 192.168.89.2
          aux_addresses:          # adresses réservées (jamais attribuées par Docker)
            windows_host: 192.168.89.1
            shim_host: 192.168.89.99
            vip: 192.168.89.100
            vm_ens160: 192.168.89.136

  # Journaux : LB → collecteur (non internal : publication 127.0.0.1:5514/udp)
  log_net:
    driver: bridge
    driver_opts: { com.docker.network.bridge.name: br-p7-log }
    ipam:
      config: [{ subnet: 172.30.40.0/24 }]

  # Tier web : LB ↔ nginx
  front_net:
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.bridge.name: br-p7-front
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    ipam:
      config: [{ subnet: 172.30.10.0/24 }]

  # Tier app : nginx ↔ php-fpm
  app_net:
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.bridge.name: br-p7-app
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    ipam:
      config: [{ subnet: 172.30.20.0/24 }]

  # Tier données : interne (aucune route vers l'extérieur, aucun port publié)
  db_net:
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.bridge.name: br-p7-db
      # Aucune IP côté hôte sur ce bridge : la base est injoignable même depuis la VM
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    ipam:
      config: [{ subnet: 172.30.30.0/24 }]

volumes:
  galera1_data:
  galera2_data:
  galera3_data:

# Secrets : fichiers générés depuis .env par scripts/deploy.sh (secrets/ en 700,
# label SELinux container_file_t), montés en lecture seule dans /run/secrets.
secrets:
  db_root_password:    { file: ./secrets/db_root_password }
  db_sst_password:     { file: ./secrets/db_sst_password }
  db_monitor_password: { file: ./secrets/db_monitor_password }
  db_app_password:     { file: ./secrets/db_app_password }
  db_backup_password:  { file: ./secrets/db_backup_password }
  haproxy_pem:         { file: ./secrets/haproxy_pem }        # certificat + clé (PKI phase 2)
  haproxy_users_cfg:   { file: ./secrets/haproxy_users_cfg }  # userlist stats (SHA-512)
  vrrp_password:       { file: ./secrets/vrrp_password }
