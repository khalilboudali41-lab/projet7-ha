# =============================================================================
# Tier web – nginx non-root (uid 101), port 8080, système de fichiers en lecture seule.
# Reçoit le trafic de HAProxy (front_net) et le répartit sur les 3 php-fpm (app_net).
# Les en-têtes de sécurité HTTP et le TLS sont gérés de façon centralisée par HAProxy.
# =============================================================================
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # IP réelle du client : transmise par HAProxy (seuls les LB sont crus)
    set_real_ip_from 172.30.10.0/24;
    real_ip_header   X-Forwarded-For;

    log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                    'rt=$request_time app=$upstream_addr ua="$http_user_agent"';
    access_log /dev/stdout main;

    keepalive_timeout    30s;
    client_max_body_size 64k;
    client_body_timeout  10s;
    client_header_timeout 10s;

    # 3 serveurs app : un php-fpm en panne est écarté 10 s et la requête rejouée ailleurs
    upstream php_backends {
        server 172.30.20.11:9000 max_fails=1 fail_timeout=10s;
        server 172.30.20.12:9000 max_fails=1 fail_timeout=10s;
        server 172.30.20.13:9000 max_fails=1 fail_timeout=10s;
    }

    server {
        listen 8080;
        server_name _;

        # Sonde du conteneur lui-même (healthcheck Docker)
        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Contrôleur frontal unique : toute requête va à index.php
        location / {
            limit_except GET HEAD { deny all; }
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/index.php;
            fastcgi_param SCRIPT_NAME     /index.php;
            fastcgi_param WEB_NODE        $hostname;
            fastcgi_pass  php_backends;
            fastcgi_connect_timeout   500ms;  # php-fpm mort → essai suivant ; pire cas 2 morts = 1 s (test_failover_app.sh)
            fastcgi_read_timeout      15s;
            fastcgi_next_upstream     error timeout invalid_header;
            fastcgi_next_upstream_tries 3;
            add_header X-Web-Node $hostname always;
        }
    }
}
